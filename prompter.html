<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompter — AI가 개발자를 대체할 수 있을까요?</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
              "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;
  user-select:none;cursor:default;
}
:root{
  --bg:#0A0A0B; --ink:#F4F4F3; --dim:#6E6E78; --line:#232329;
  --accent:#FF6A2B; --panel:#131317;
}
body.light{ --bg:#FBFBFA; --ink:#101012; --dim:#8A8A93; --line:#E2E2DF; --accent:#E03F00; --panel:#F1F1EF; }

/* ---------- top bar ---------- */
#bar{
  flex:none;display:flex;align-items:center;gap:28px;
  padding:11px 34px;border-bottom:2px solid var(--line);background:var(--panel);
}
#pnum{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent)}
#ptot{font-size:20px;color:var(--dim);font-weight:600;margin-left:6px}
#ptitle{font-size:25px;font-weight:700;letter-spacing:-.02em;flex:1;
        overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill{
  font-size:20px;font-weight:700;letter-spacing:.02em;color:var(--dim);
  border:2px solid var(--line);border-radius:999px;padding:5px 16px;white-space:nowrap;
}
.pill b{color:var(--ink)}
#clock{font-variant-numeric:tabular-nums;min-width:124px;text-align:center}
#clock.run b{color:var(--accent)}
#link{font-size:17px;color:var(--dim);white-space:nowrap}
#link.on{color:#2ECC71}

/* ---------- script ---------- */
#view{flex:1;position:relative;overflow:hidden;padding:22px 34px}
#body{
  height:100%;column-gap:58px;column-fill:auto;
  line-height:1.42;letter-spacing:-.018em;font-weight:500;
}
#body p{margin:0 0 .62em}
#body p.list{padding-left:1.1em;text-indent:-1.1em;margin-bottom:.28em}
#body h3{
  font-size:.82em;font-weight:800;color:var(--accent);letter-spacing:-.02em;
  margin:.5em 0 .35em;break-after:avoid;
}
#body .cue{
  font-style:normal;display:inline-block;
  filter:drop-shadow(0 0 10px rgba(255,106,43,.85));
  transform:translateY(-.04em);
}
#body .pause{color:var(--dim);font-weight:600}

/* ---------- bottom ---------- */
#foot{
  flex:none;display:flex;align-items:center;gap:24px;
  padding:9px 34px;border-top:2px solid var(--line);background:var(--panel);
}
#next{font-size:20px;color:var(--dim);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#next b{color:var(--ink);font-weight:700}
#keys{font-size:15px;color:var(--dim);white-space:nowrap;letter-spacing:.01em}
#keys kbd{
  font-family:inherit;font-weight:700;color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:0 2px;
}
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--accent);color:#fff;font-size:22px;font-weight:700;
  padding:12px 26px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;
}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="bar">
  <div><span id="pnum">01</span><span id="ptot">/ 17</span></div>
  <div id="ptitle">—</div>
  <div class="pill" id="clicks">클릭 <b>0</b> / 0</div>
  <div class="pill" id="clock"><b>00:00</b></div>
  <div id="link">연결 대기…</div>
</div>

<div id="view"><div id="body"></div></div>

<div id="foot">
  <div id="next"></div>
  <div id="keys">
    <kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>+</kbd><kbd>−</kbd> 글자 · <kbd>S</kbd> 타이머 · <kbd>R</kbd> 리셋 · <kbd>T</kbd> 색 · <kbd>F</kbd> 전체화면
  </div>
</div>

<div id="toast"></div>

<script src="talk-script.js"></script>
<script src="prompter.js"></script>
</body>
</html>
